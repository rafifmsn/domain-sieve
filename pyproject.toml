[project]
name = "domain-sieve"
version = "0.1.0"
description = "Lightweight single-node illegal-website discovery, rendering, and classification pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiodns>=3.2.0",
    "crawl4ai>=0.6.0",
    "dnstwist>=20240101",
    "httpx>=0.28.0",
    "psutil>=6.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "sentencepiece>=0.2.0",
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sieve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
